name: Build and Publish Tauri Mobile Apps

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
      - name: Install cargo-mobile2
        run: cargo install --git https://github.com/tauri-apps/cargo-mobile2
      - name: Install frontend dependencies
        run: yarn install # or npm install, pnpm install
      - name: Build Android app
        run: cargo tauri android build
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-app
          path: src-tauri/target/android/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install cargo-mobile2
        run: cargo install --git https://github.com/tauri-apps/cargo-mobile2
      - name: Install frontend dependencies
        run: yarn install # or npm install, pnpm install
      - name: Build iOS app
        run: cargo tauri ios build
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-app
          path: src-tauri/target/ios/*.ipa
