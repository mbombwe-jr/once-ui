name: publish

on:
  push:
    branches:
      - release
  workflow_dispatch: # Enables manual runs from the Actions tab

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Xcode Command Line Tools
        run: sudo xcode-select --install || true # Added error handling for already installed tools

      - name: Set Xcode Developer Directory
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Verify xcrun
        run: xcrun --version

      - name: Install Rust
        run: rustup install stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Tauri CLI
        run: cargo install tauri-cli
        working-directory: ./src-tauri

  publish-tauri-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository # Fixed: Added name for consistency
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            wget \
            unzip \
            libssl-dev \
            pkg-config \
            libudev-dev

      - name: Install pnpm globally
        run: npm install -g pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm # Fixed: Removed quotes for consistency

      - name: Install Rust and target
        run: |
          rustup install stable
          rustup target add aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
       
